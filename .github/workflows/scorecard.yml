name: Scorecard

# OpenSSF Scorecard checks how the repository itself is run: pinned dependencies, token
# permissions, code review, branch protection, and so on. The score is public, at
# https://scorecard.dev/viewer/?uri=github.com/Critical-Computing-Cadre/truman3, and the findings
# show under the repository's Security tab. See docs/development.md, "Security".
on:
  push:
    branches: [main]
  schedule:
    # Mondays at 07:30 UTC, to catch a change in the repository's settings.
    - cron: "30 7 * * 1"
  workflow_dispatch:

# Nothing by default. The job asks for what it needs.
permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # To add findings to the Security tab.
      security-events: write
      # To prove to Scorecard's service which repository the results are from.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
