name: Deploy

# A merge into main deploys staging. Production then waits for a person to approve it, on the
# run's page. See ADR 88 and docs/cloud.md, "Deploys from GitHub".
#
# GitHub holds no AWS keys. Each job proves to AWS which repository and which GitHub environment
# it's running in, and AWS lets it take that stage's deploy role only if both match. A pull request
# can't run this, and neither can a fork.
on:
  push:
    branches: [main]
    # The repo's own docs don't run anywhere. The site's pages, in apps/site, do.
    paths-ignore: ["docs/**", "*.md"]

permissions:
  contents: read

jobs:
  staging:
    # The API's image is built for ARM, which this builds without emulation.
    runs-on: ubuntu-24.04-arm
    environment: staging
    # One deploy of staging at a time, never cancelled partway. If several merges are waiting, the
    # newest goes next. Production's wait for approval is a separate queue, so it can't hold this up.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The commits since the last deploy, to see which migrations are new.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pull request ran every test. These are the quick ones again, on the merged code.
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::966038456825:role/truman3-staging-deploy
          aws-region: us-east-1
      - run: bash scripts/deploy-from-ci.sh staging "${{ github.event.before }}" "${{ github.sha }}"

  production:
    needs: staging
    runs-on: ubuntu-24.04-arm
    # This environment has required reviewers, so the job waits here until one of them approves.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Each merge waits for its own approval. Approving an older one after a newer one has gone
      # out would put production back. So only the newest merge deploys: an older run stops here.
      - name: Check this is still the newest merge
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            echo "::error title=A newer merge is waiting::main has moved on from this commit. Approve the newest run instead, and reject this one."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::935902555319:role/truman3-production-deploy
          aws-region: us-east-1
      - run: bash scripts/deploy-from-ci.sh production "${{ github.event.before }}" "${{ github.sha }}"
