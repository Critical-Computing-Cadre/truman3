# Dependabot proposes updates as pull requests, once a week, grouped so there are a few to read and
# not dozens. An update has to have been out for two weeks first, the same rule as for a new
# dependency (docs/development.md, "Dependencies"). A fix for a known vulnerability doesn't wait.
# It doesn't propose major versions: Node 24 to 26, say. Those are changed by hand, everywhere at once.
version: 2
updates:
  # The workspace: every app and package except the phone app.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    # A major version is a person's decision, made with the whole test suite on it.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The phone app is its own npm project (ADR 66). Expo decides which versions of its packages go
  # together, so this proposes security fixes only: a limit of 0 turns version updates off and
  # leaves those on. apps/mobile/README.md, "Updating its packages", says how to update the rest.
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  # The API's base image, in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    # A major version is a person's decision, made with the whole test suite on it.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The images local development and the container check use.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    # A major version is a person's decision, made with the whole test suite on it.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The actions the workflows use, which are pinned to a commit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    # A major version is a person's decision, made with the whole test suite on it.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
