# A starter: sample content for trying out the Forum kind of platform. The New Study page offers
# it as "Start with sample content". Its people, posts, and pictures are made up.
schemaVersion: 1
slug: forum-starter
title: Forum sample
site: { name: Threadly }
length: { days: 2 }
entry: { idParam: PROLIFIC_PID, idLabel: Prolific ID, source: prolific }
conditions:
  assignment: { method: uniform }
  arms: [{ key: control }]
platform:
  style: mixed
  template: forum
  # So the note a new member gets has somewhere to arrive.
  features: { messages: true }
likes: { comments: [0, 1, 3] }
flow:
  - { step: consent, page: pages/consent.md }
  - { step: account }
  - { step: feed }
  - { step: exit }
