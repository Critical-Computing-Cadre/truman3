# A starter: sample content for trying out the Short posts kind of platform. The New Study page offers
# it as "Start with sample content". Its people, posts, and pictures are made up.
schemaVersion: 1
slug: short-posts-starter
title: Short posts sample
site: { name: Skyline }
length: { days: 2 }
entry: { idParam: PROLIFIC_PID, idLabel: Prolific ID, source: prolific }
conditions:
  assignment: { method: uniform }
  arms: [{ key: control }]
platform:
  style: text
  template: shortPosts
  maxPostLength: 300
  # So the hello a new account gets has somewhere to arrive.
  features: { messages: true }
  trending:
    - { tag: weather, note: 2.1K posts }
    - { tag: transit }
    - { tag: books, note: 640 posts }
flow:
  - { step: consent, page: pages/consent.md }
  - { step: account }
  - { step: feed }
  - { step: exit }
