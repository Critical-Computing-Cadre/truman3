# What a new account on a short-video app gets in its first minutes: a follow and a hello.
# It's here so Messages and Notifications aren't empty in the sample.
beats:
  - id: sunwatcher-follows
    note: The sun account follows them as they arrive.
    when: { time: "0:00" }
    do: { action: follow, actor: sunwatcher }

  - id: sunwatcher-says-hi
    note: And says hello.
    when: { time: "0:00" }
    do:
      action: message
      actor: sunwatcher
      text: "hey! welcome to Loop. swipe up for more"
