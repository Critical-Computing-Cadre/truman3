# A starter: sample content for trying out the Short video kind of platform. The New Study page
# offers it as "Start with sample content". Its people and posts are made up. Its videos are cut
# from NASA's public-domain footage, with their sound replaced. CREDITS.md says where each is from.
schemaVersion: 1
slug: short-video-starter
title: Short video sample
site: { name: Loop }
length: { days: 2 }
entry: { idParam: PROLIFIC_PID, idLabel: Prolific ID, source: prolific }
conditions:
  assignment: { method: uniform }
  arms: [{ key: control }]
platform:
  style: mixed
  template: shortVideo
  maxPostLength: 300
  # So the hello a new account gets has somewhere to arrive.
  features: { messages: true }
flow:
  - { step: consent, page: pages/consent.md }
  - { step: account }
  - { step: feed }
  - { step: exit }
