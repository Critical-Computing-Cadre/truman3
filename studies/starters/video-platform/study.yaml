# A starter: sample content for trying out the Video platform kind of site. The New Study page
# offers it as "Start with sample content". Its people and posts are made up. Its videos are cut
# from NASA's public-domain footage, with their sound replaced. CREDITS.md says where each is from.
schemaVersion: 1
slug: video-platform-starter
title: Video platform sample
site: { name: Lookout }
length: { days: 2 }
entry: { idParam: PROLIFIC_PID, idLabel: Prolific ID, source: prolific }
conditions:
  assignment: { method: uniform }
  arms: [{ key: control }]
platform:
  style: mixed
  template: videoPlatform
  maxPostLength: 5000
  # Ads before videos (ADR 97): one before every 2nd video someone opens, skippable after 5 seconds.
  # Both advertisers are made up, and their links go nowhere real.
  prerolls:
    every: 2
    skipAfter: 5
    ads:
      - id: coffee
        video: ad-coffee.mp4
        poster: ad-coffee.jpg
        captions: ad-coffee.vtt
        advertiser: Hollowbean Coffee
        label: Ad
        link: https://example.com/hollowbean
      - id: phone
        video: ad-phone.mp4
        poster: ad-phone.jpg
        advertiser: Zephyr Talk
        label: Sponsored
        link: https://example.com/zephyr
flow:
  - { step: consent, page: pages/consent.md }
  - { step: account }
  - { step: feed }
  - { step: exit }
