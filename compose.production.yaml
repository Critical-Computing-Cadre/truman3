# Runs the API's container the way production does, against throwaway services. Nothing here is a
# real password, and nothing is kept. scripts/check-container.sh uses this.
name: truman3-container-check

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: truman
      POSTGRES_PASSWORD: truman
      POSTGRES_DB: truman
    volumes:
      # An owner who isn't a superuser, as on a hosted database like RDS.
      - ./scripts/postgres-owner.sql:/docker-entrypoint-initdb.d/owner.sql:ro
    healthcheck:
      # Over the network, which only opens once the setup above has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U truman -d truman"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    image: chrislusf/seaweedfs:4.51
    command: server -dir=/data -s3 -s3.port=8333
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8333/status"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs once and stops, before the API starts.
  migrate:
    build: .
    image: truman3-api
    command: ["node", "packages/db/src/migrate-cli.ts"]
    environment:
      DATABASE_URL: postgres://truman_owner:owner_password@postgres:5432/truman_study
      DATABASE_APP_PASSWORD: app_password
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: truman3-api
    environment:
      DATABASE_URL: postgres://truman_app:app_password@postgres:5432/truman_study
      S3_ENDPOINT: http://storage:8333
      S3_REGION: us-east-1
      S3_BUCKET: truman-media
      S3_ACCESS_KEY_ID: local
      S3_SECRET_ACCESS_KEY: local
      MEDIA_PUBLIC_URL: http://localhost:8333/truman-media
      PARTICIPANT_APP_URL: http://localhost:5192
    ports:
      - "127.0.0.1:${TRUMAN_CHECK_PORT:-3220}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
